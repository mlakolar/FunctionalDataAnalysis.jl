name: CI

on:
    push:
        branches: [main]
        tags: ['*']
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
    test:
        name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        permissions:
            actions: write
            contents: read
        strategy:
            fail-fast: false
            matrix:
                julia-version: ['1.10', '1']
                os: [ubuntu-latest, macos-latest]
        steps:
            - uses: actions/checkout@v7
            - uses: julia-actions/setup-julia@v3
              with:
                  version: ${{ matrix.julia-version }}
            - uses: julia-actions/cache@v3
            - name: Install unregistered KernelSmoothing on Julia 1.10
              if: matrix.julia-version == '1.10'
              run: julia --project=. -e 'using Pkg; Pkg.add(url = "https://github.com/mlakolar/KernelSmoothing.jl")'
            - uses: julia-actions/julia-buildpkg@v1
            - uses: julia-actions/julia-runtest@v1
            - uses: julia-actions/julia-processcoverage@v1
            - uses: codecov/codecov-action@v7
              with:
                  files: lcov.info
                  token: ${{ secrets.CODECOV_TOKEN }}
                  fail_ci_if_error: false

    docs:
        name: Documentation
        runs-on: ubuntu-latest
        permissions:
            actions: write
            contents: write
            statuses: write
        steps:
            - uses: actions/checkout@v7
            - uses: julia-actions/setup-julia@v3
              with:
                  version: '1'
            - uses: julia-actions/cache@v3
            - name: Install dependencies
              run: julia --project=docs -e 'using Pkg; Pkg.add(url = "https://github.com/mlakolar/KernelSmoothing.jl"); Pkg.develop(path = "."); Pkg.instantiate()'
            - name: Build and deploy
              run: julia --project=docs docs/make.jl
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
