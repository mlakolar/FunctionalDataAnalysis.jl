name: CI

on:
    push:
        branches: [master]
        tags: ['*']
    pull_request:
    workflow_dispatch:
        inputs:
            dataset_download:
                description: Run only the fresh full-dataset release download smoke
                type: boolean
                default: false
            coverage_study:
                description: Run only the band coverage regression or larger study
                type: choice
                default: none
                options: [none, regression, full]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

env:
    JULIA_NUM_THREADS: '1'
    OPENBLAS_NUM_THREADS: '1'
    OMP_NUM_THREADS: '1'
    MKL_NUM_THREADS: '1'

jobs:
    test:
        if: github.event_name != 'workflow_dispatch' || (inputs.coverage_study == 'none' && !inputs.dataset_download)
        name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        permissions:
            actions: write
            contents: read
        strategy:
            fail-fast: false
            matrix:
                julia-version: ['1.10', '1']
                os: [ubuntu-latest, macos-latest]
        steps:
            - uses: actions/checkout@v7
            - uses: julia-actions/setup-julia@v3
              with:
                  version: ${{ matrix.julia-version }}
            - uses: julia-actions/cache@v3
            - name: Check naming conventions
              run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/check_naming.py
            - name: Resolve dependencies from master checkouts
              run: julia --color=yes scripts/instantiate.jl
            - uses: julia-actions/julia-buildpkg@v1
            - name: Test against dependency master checkouts
              run: julia --color=yes scripts/test_master.jl
              env:
                JULIA_TEST_COVERAGE: "true"
            - uses: julia-actions/julia-processcoverage@v1
            - uses: codecov/codecov-action@v7
              with:
                  files: lcov.info
                  token: ${{ secrets.CODECOV_TOKEN }}
                  fail_ci_if_error: false

    docs:
        if: github.event_name != 'workflow_dispatch' || (inputs.coverage_study == 'none' && !inputs.dataset_download)
        name: Documentation
        runs-on: ubuntu-latest
        permissions:
            actions: write
            contents: write
            statuses: write
        steps:
            - uses: actions/checkout@v7
            - uses: julia-actions/setup-julia@v3
              with:
                  version: '1'
            - uses: julia-actions/cache@v3
            - name: Install dependencies
              run: julia scripts/instantiate.jl docs
            - name: Build and deploy
              run: julia --project=docs docs/make.jl
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    jet:
        if: github.event_name != 'workflow_dispatch' || (inputs.coverage_study == 'none' && !inputs.dataset_download)
        name: Bounded JET baseline
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7
            - uses: julia-actions/setup-julia@v3
              with:
                  version: '1.13.2'
            - uses: julia-actions/cache@v3
            - name: Check reviewed JET baseline against dependency masters
              shell: bash
              run: julia --color=yes scripts/test_master.jl --jet 2>&1 | tee jet.log
            - name: Retain full diagnostics
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: jet-${{ github.run_id }}
                  path: jet.log

    threaded-smoke:
        if: github.event_name != 'workflow_dispatch' || (inputs.coverage_study == 'none' && !inputs.dataset_download)
        name: Golden smoke (Julia 4, BLAS 1)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        env:
            JULIA_NUM_THREADS: '4'
        steps:
            - uses: actions/checkout@v7
            - uses: julia-actions/setup-julia@v3
              with:
                  version: '1'
            - uses: julia-actions/cache@v3
            - name: Run existing goldens and former-smoother comparisons
              run: julia --color=yes scripts/test_master.jl --threaded-smoke

    dataset-download:
        name: Fresh dataset download smoke
        if: github.event_name == 'workflow_dispatch' && inputs.dataset_download
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7
            - uses: julia-actions/setup-julia@v3
              with:
                  version: '1'
            - name: Download and validate the shipped full dataset artifact
              shell: bash
              run: julia --color=yes scripts/test_master.jl --dataset-smoke 2>&1 | tee dataset-download.log
            - name: Retain download and reference checks
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: dataset-download-${{ github.run_id }}
                  path: dataset-download.log

    coverage-study:
        name: Band coverage study
        if: github.event_name == 'workflow_dispatch' && inputs.coverage_study != 'none' && !inputs.dataset_download
        runs-on: ubuntu-latest
        permissions:
            actions: write
            contents: read
        env:
            JULIA_NUM_THREADS: '1'
            OPENBLAS_NUM_THREADS: '1'
            OMP_NUM_THREADS: '1'
            MKL_NUM_THREADS: '1'
            FDA_BANDS_FULL_COVERAGE: ${{ inputs.coverage_study == 'full' && 'true' || 'false' }}
        steps:
            - uses: actions/checkout@v7
            - uses: julia-actions/setup-julia@v3
              with:
                  version: '1'
            - uses: julia-actions/cache@v3
            - name: Run the unchanged statistical regression
              shell: bash
              run: julia --color=yes scripts/test_master.jl --coverage-study 2>&1 | tee coverage-study.log
            - name: Retain study results
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: band-coverage-${{ inputs.coverage_study }}-${{ github.run_id }}
                  path: coverage-study.log
